    Projects:
      - name: hackingBuddyGPT
        summary: Original author. A research framework for building LLM-driven offensive-security agents in 50 lines of Python or less; backs several of my papers and has grown into a community project.
        highlights:
          - Selected for the GitHub AI Accelerator 2024.
        start_date: 2023
        end_date: present

      - name: Cochise
        summary: Open-source reference harness for autonomous assumed-breach penetration testing of Active Directory networks, evaluated against the GOAD testbed. Accompanying paper in ACM TOSEM, tool paper at ASE 2026.
        start_date: 2025
        end_date: present

      - name: OWASP Operational Technology (OT) Top 10
        summary: Project founder and leader. Awareness document listing the most critical security risks in operational technology.
        start_date: 2024
        end_date: present

      - name: OWASP Top 10 Proactive Controls
        summary: Project leader. The developer-facing list of the ten security techniques every software project should build in.
        start_date: 2023
        end_date: present

      - name: PRISMACLOUD (Horizon 2020)
        summary: Design, development and maintenance of the privacy-preserving multi-cloud storage prototype. EU Horizon 2020 project coordinated by AIT (grant 644962).
        start_date: 2015
        end_date: 2018

      - name: CREDENTIAL (Horizon 2020)
        summary: Development of the data-sharing and identity-management components of a secure cloud identity wallet based on proxy re-encryption. EU Horizon 2020 project coordinated by AIT (grant 653454).
        start_date: 2015
        end_date: 2018

      - name: Archistar
        summary: Architecture and implementation of a secure multi-cloud storage system combining Byzantine fault tolerance with secret sharing. AIT research project funded by the Austrian BMVIT.
        start_date: 2012
        end_date: 2015

      - name: SECOQC
        summary: Networking components (Linux, Python, C) of the first metropolitan quantum key distribution network, demonstrated in Vienna in 2008; afterwards maintenance and further development of the open-source QKD software stack.
        start_date: 2006
        end_date: 2012

