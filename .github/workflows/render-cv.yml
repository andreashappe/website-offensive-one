name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          cv_file=$(find _data  -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          # _data/cv.yml also feeds the web CV (al_folio_cv), which uses fields RenderCV rejects.
          # Render from a translated copy one level deep so the ../assets paths in settings.yaml still resolve.
          mkdir -p .rendercv
          python - "$cv_file" .rendercv/cv.yml <<'EOF'
          import sys
          import yaml

          data = yaml.safe_load(open(sys.argv[1]))
          cv = data["cv"]
          cv.pop("image", None)
          if "label" in cv:
              cv["headline"] = cv.pop("label")
          if "summary" in cv:
              cv["sections"] = {"Summary": [cv.pop("summary")], **cv["sections"]}
          for entry in cv["sections"].get("Publications", []):
              if "releaseDate" in entry:
                  entry["date"] = entry.pop("releaseDate")
              if "publisher" in entry:
                  entry["journal"] = entry.pop("publisher")
          yaml.safe_dump(data, open(sys.argv[2], "w"), allow_unicode=True, sort_keys=False)
          EOF
          rendercv render .rendercv/cv.yml --settings $settings
          rm -rf .rendercv
          rm assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: render the latest CV" && git push; }
